<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map of Memories</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>

    <div class="top-bar">
        <h1 class="logo">Map of Memories</h1>
        <div class="nav-buttons">
            <button id="how-btn" class="nav-link">How it works</button>
            <button id="suggestion-toggle" class="nav-link">Feedback</button>
        </div>
    </div>

    <div id="how-box" class="modal hidden">
        <div class="glass-card">
            <h3>How it Works</h3>
            <p>Click anywhere on the map to drop a glowing memory. Share a thought, a feeling, or a moment that happened right there.</p>
            <button id="close-how">Got it!</button>
        </div>
    </div>

    <div id="suggestion-box" class="modal hidden">
        <div class="glass-card">
            <h3>Feedback</h3>
            <textarea id="suggestion-input" placeholder="Have an idea to make this map better?"></textarea>
            <div class="btn-group">
                <button id="send-suggestion">Send</button>
                <button id="close-suggestion">Close</button>
            </div>
        </div>
    </div>

    <div id="input-container" class="modal hidden">
        <div class="glass-card">
            <h3>Share a Memory</h3>
            <textarea id="memory-input" placeholder="What happened here?"></textarea>
            <div class="btn-group">
                <button id="send-btn">Post Glow</button>
                <button id="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
