<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map of Memories</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>

    <div class="top-bar">
        <h1 class="logo">Map of Memories</h1>
        <div id="user-controls">
            <button id="auth-btn" onclick="openAuth()">Sign In</button>
        </div>
    </div>

    <div id="auth-container" class="modal hidden">
        <div class="glass-card auth-card">
            <h2>Welcome Back</h2>
            <p>Join the community to share your glows.</p>
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Password">
            <div class="auth-buttons">
                <button onclick="handleAuth('login')">Log In</button>
                <button onclick="handleAuth('signup')" class="secondary-btn">Sign Up</button>
            </div>
            <button onclick="closeAuth()" class="close-x">×</button>
        </div>
    </div>

    <div id="input-container" class="modal hidden">
        <div class="glass-card">
            <h3>Share a Memory</h3>
            <textarea id="memory-input" placeholder="What happened here?"></textarea>
            <div class="btn-group">
                <button id="send-btn">Post Glow</button>
                <button id="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
